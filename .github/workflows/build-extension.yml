name: Build Chrome extension ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Zip Chrome extension contents
        run: |
          cd dist
          zip -r ../Doc-Inspector-HP-v1.5.8.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Doc-Inspector-HP-v1.5.8
          path: Doc-Inspector-HP-v1.5.8.zip
